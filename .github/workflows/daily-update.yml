name: Daily Mavericks update

on:
  schedule:
    # 毎日 日本時間 6:00 頃（UTC 21:00）
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Mavericks data
        run: python update_data.py

      - name: Commit updated data
        run: |
          git config user.name "mavs-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add meta.json news.json roster.json
          git diff --cached --quiet || git commit -m "Daily Mavericks update"
          git push
