name: Daily Mavericks update

on:
  schedule:
    - cron: "15 21 * * *"  # 06:15 JST every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update data
        run: python scripts/update_data.py

      - name: Commit changed data
        run: |
          git config user.name "mavs-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily Mavericks data update"
          git push
